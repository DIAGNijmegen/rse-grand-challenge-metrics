name: Publish Package

on:
  release:
    types:
      - published

env:
  MINIMUM_PYTHON_VERSION: '3.11'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-for-pypi:
      needs: ci
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Install uv and set the python version
          uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
          with:
            python-version: ${{ env.MINIMUM_PYTHON_VERSION }}
        - name: Build the package
          run: uv build
        - name: 'Upload Artifact'
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
            name: python-dist
            path: dist/
            if-no-files-found: error
            retention-days: 1

  deploy-to-pypi:
      # IMPORTANT: use a seperate job for this as each step has access to the tokens
      needs: build-for-pypi
      runs-on: ubuntu-latest
      environment: pypi
      permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
        id-token: write
      steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
